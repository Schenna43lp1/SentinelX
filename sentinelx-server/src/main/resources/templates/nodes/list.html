<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Nodes')}"></head>
<body>

<div class="sx-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('nodes')}"></div>

    <div class="sx-main">
        <div th:replace="~{fragments/layout :: topbar('Nodes', 'bi-hdd-network')}"></div>

        <div class="sx-content">

            <div class="sx-page-header">
                <div>
                    <h1 class="sx-page-title">Nodes</h1>
                    <p class="sx-page-subtitle">All registered monitoring agents</p>
                </div>
                <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                    <div class="sx-search">
                        <i class="bi bi-search"></i>
                        <input type="text" id="sxTableSearch" class="sx-input" placeholder="Search nodes…"/>
                    </div>
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/nodes/new}"
                       class="sx-btn sx-btn-primary">
                        <i class="bi bi-plus-lg"></i> Add Node
                    </a>
                </div>
            </div>

            <div th:if="${successMessage}" class="sx-flash sx-flash-success">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${successMessage}"></span>
                <button class="sx-flash-dismiss" type="button">&times;</button>
            </div>
            <div th:if="${errorMessage}" class="sx-flash sx-flash-error">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${errorMessage}"></span>
                <button class="sx-flash-dismiss" type="button">&times;</button>
            </div>

            <div class="sx-card">
                <div class="sx-card-body-flush">
                    <div class="sx-table-wrap">
                        <table class="sx-table">
                            <thead>
                                <tr>
                                    <th>Status</th>
                                    <th class="sortable">Name</th>
                                    <th>Hostname</th>
                                    <th>IP Address</th>
                                    <th>OS</th>
                                    <th>Last Seen</th>
                                    <th>Agent</th>
                                    <th>Tags</th>
                                    <th sec:authorize="hasRole('ADMIN')"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="node : ${nodes}" data-search-row="">
                                    <td>
                                        <span th:if="${node.status.name() == 'ONLINE'}"
                                              class="sx-status sx-status--online">
                                            <span class="sx-status-dot"></span>Online
                                        </span>
                                        <span th:unless="${node.status.name() == 'ONLINE'}"
                                              class="sx-status sx-status--offline">
                                            <span class="sx-status-dot"></span>Offline
                                        </span>
                                    </td>
                                    <td>
                                        <a th:href="@{/nodes/{id}(id=${node.id})}"
                                           th:text="${node.name}"
                                           style="color:var(--sx-text);font-weight:600;"></a>
                                    </td>
                                    <td class="muted" th:text="${node.hostname}">—</td>
                                    <td class="muted" style="font-size:12px;" th:text="${node.ipAddress ?: '—'}">—</td>
                                    <td class="muted" style="font-size:12px;" th:text="${node.os ?: '—'}">—</td>
                                    <td class="muted" style="font-size:12px;"
                                        th:text="${node.lastSeen != null ? #temporals.format(node.lastSeen, 'yyyy-MM-dd HH:mm') : 'Never'}">—</td>
                                    <td class="muted" style="font-size:11px;" th:text="${node.agentVersion ?: '—'}">—</td>
                                    <td>
                                        <span th:if="${node.tags != null and !#strings.isEmpty(node.tags)}"
                                              class="sx-badge sx-badge--tag"
                                              th:text="${node.tags}">tag</span>
                                    </td>
                                    <td sec:authorize="hasRole('ADMIN')">
                                        <div style="display:flex;gap:6px;">
                                            <a th:href="@{/nodes/{id}/edit(id=${node.id})}"
                                               class="sx-btn sx-btn-ghost sx-btn-sm" title="Edit">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:action="@{/nodes/{id}/delete(id=${node.id})}" method="post"
                                                  onsubmit="return confirm('Delete this node and all its metrics?')">
                                                <button type="submit" class="sx-btn sx-btn-danger sx-btn-sm" title="Delete">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(nodes)}">
                                    <td colspan="9" style="text-align:center;padding:40px;color:var(--sx-text-muted);">
                                        <i class="bi bi-hdd-network" style="font-size:32px;display:block;margin-bottom:10px;"></i>
                                        No nodes registered yet.
                                        <a sec:authorize="hasRole('ADMIN')" th:href="@{/nodes/new}"> Add your first node.</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
