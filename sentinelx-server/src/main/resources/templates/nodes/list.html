<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Nodes')}"></head>
<body class="bg-dark text-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-semibold mb-0"><i class="bi bi-hdd-network me-2 text-primary"></i>Nodes</h4>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/nodes/new}" class="btn btn-primary btn-sm">
            <i class="bi bi-plus-circle me-1"></i>Add Node
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show py-2" role="alert">
        <i class="bi bi-check-circle me-1"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
    </div>

    <div class="card bg-secondary border-0 shadow">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead class="text-muted small">
                        <tr>
                            <th>Name</th>
                            <th>Hostname</th>
                            <th>IP</th>
                            <th>OS</th>
                            <th>Agent</th>
                            <th>Tags</th>
                            <th>Status</th>
                            <th>Last Seen</th>
                            <th sec:authorize="hasRole('ADMIN')">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="node : ${nodes}">
                            <td>
                                <a th:href="@{/nodes/{id}(id=${node.id})}"
                                   class="text-decoration-none text-light fw-semibold"
                                   th:text="${node.name}">name</a>
                            </td>
                            <td class="text-muted" th:text="${node.hostname}">host</td>
                            <td class="text-muted small" th:text="${node.ipAddress ?: '-'}">-</td>
                            <td class="text-muted small" th:text="${node.os ?: '-'}">-</td>
                            <td class="text-muted small" th:text="${node.agentVersion ?: '-'}">-</td>
                            <td>
                                <span th:if="${node.tags != null and !#strings.isEmpty(node.tags)}"
                                      class="badge bg-dark border border-secondary"
                                      th:text="${node.tags}">tags</span>
                            </td>
                            <td>
                                <span th:if="${node.status.name() == 'ONLINE'}" class="badge bg-success">
                                    <i class="bi bi-circle-fill me-1" style="font-size:.5rem"></i>ONLINE
                                </span>
                                <span th:unless="${node.status.name() == 'ONLINE'}" class="badge bg-danger">
                                    <i class="bi bi-circle-fill me-1" style="font-size:.5rem"></i>OFFLINE
                                </span>
                            </td>
                            <td class="text-muted small"
                                th:text="${node.lastSeen != null ? #temporals.format(node.lastSeen, 'yyyy-MM-dd HH:mm:ss') : 'Never'}">-</td>
                            <td sec:authorize="hasRole('ADMIN')">
                                <a th:href="@{/nodes/{id}/edit(id=${node.id})}"
                                   class="btn btn-sm btn-outline-secondary me-1" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/nodes/{id}/delete(id=${node.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Delete this node and all its metrics?')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(nodes)}">
                            <td colspan="9" class="text-center text-muted py-4">
                                <i class="bi bi-hdd-network fs-3 d-block mb-2"></i>
                                No nodes registered yet.
                                <a sec:authorize="hasRole('ADMIN')" th:href="@{/nodes/new}">Add your first node.</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmJ6OOBmzQ/GZI6tQJrDRl2/J9"
        crossorigin="anonymous"></script>
</body>
</html>
