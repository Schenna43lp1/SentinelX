<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Alerts')}"></head>
<body>

<div class="sx-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('alerts')}"></div>

    <div class="sx-main">
        <div th:replace="~{fragments/layout :: topbar('Alert Center', 'bi-bell')}"></div>

        <div class="sx-content">

            <div class="sx-page-header">
                <div>
                    <h1 class="sx-page-title">Alert Center</h1>
                    <p class="sx-page-subtitle">Most recent alerts first — open alerts require action</p>
                </div>
                <div style="display:flex;gap:10px;align-items:center;">
                    <div class="sx-search">
                        <i class="bi bi-search"></i>
                        <input type="text" id="sxTableSearch" class="sx-input" placeholder="Search alerts…"/>
                    </div>
                </div>
            </div>

            <div th:if="${successMessage}" class="sx-flash sx-flash-success">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${successMessage}"></span>
                <button class="sx-flash-dismiss" type="button">&times;</button>
            </div>

            <div class="sx-card">
                <div class="sx-card-body-flush">
                    <div class="sx-table-wrap">
                        <table class="sx-table">
                            <thead>
                                <tr>
                                    <th>Severity</th>
                                    <th>Status</th>
                                    <th>Type</th>
                                    <th>Title</th>
                                    <th>Node</th>
                                    <th>Time</th>
                                    <th>Acknowledged</th>
                                    <th sec:authorize="hasRole('ADMIN')">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="alert : ${alerts}"
                                    th:classappend="${alert.status.name() == 'ACKNOWLEDGED'} ? ' sx-row-acked'"
                                    data-search-row="">

                                    <!-- Severity -->
                                    <td>
                                        <span th:if="${alert.severity.name() == 'CRITICAL'}" class="sx-badge sx-badge--critical">
                                            <i class="bi bi-exclamation-octagon-fill"></i> Critical
                                        </span>
                                        <span th:if="${alert.severity.name() == 'WARNING'}" class="sx-badge sx-badge--warning">
                                            <i class="bi bi-exclamation-triangle-fill"></i> Warning
                                        </span>
                                        <span th:if="${alert.severity.name() == 'INFO'}" class="sx-badge sx-badge--info">
                                            <i class="bi bi-info-circle-fill"></i> Info
                                        </span>
                                    </td>

                                    <!-- Status -->
                                    <td>
                                        <span th:if="${alert.status.name() == 'OPEN'}"
                                              class="sx-badge sx-badge--open">Open</span>
                                        <span th:unless="${alert.status.name() == 'OPEN'}"
                                              class="sx-badge sx-badge--ack">
                                            <i class="bi bi-check-lg"></i> ACK
                                        </span>
                                    </td>

                                    <!-- Type -->
                                    <td>
                                        <span style="font-size:11px;color:var(--sx-text-muted);font-family:monospace;"
                                              th:text="${alert.type}">TYPE</span>
                                    </td>

                                    <!-- Title -->
                                    <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;"
                                        th:text="${alert.title}">title</td>

                                    <!-- Node -->
                                    <td>
                                        <a th:if="${alert.node != null}"
                                           th:href="@{/nodes/{id}(id=${alert.node.id})}"
                                           th:text="${alert.node.name}"
                                           style="color:var(--sx-text-dim);font-size:12.5px;"></a>
                                        <span th:unless="${alert.node != null}"
                                              style="color:var(--sx-text-muted);">—</span>
                                    </td>

                                    <!-- Time -->
                                    <td style="white-space:nowrap;">
                                        <span style="font-size:12px;color:var(--sx-text-muted);"
                                              th:text="${#temporals.format(alert.createdAt, 'yyyy-MM-dd')}">—</span>
                                        <br>
                                        <span style="font-size:11px;color:var(--sx-text-muted);"
                                              th:text="${#temporals.format(alert.createdAt, 'HH:mm:ss')}">—</span>
                                    </td>

                                    <!-- Acknowledged -->
                                    <td style="font-size:12px;color:var(--sx-text-muted);"
                                        th:text="${alert.acknowledgedAt != null
                                            ? #temporals.format(alert.acknowledgedAt, 'HH:mm') + ' by ' + alert.acknowledgedBy
                                            : '—'}">—</td>

                                    <!-- ACK action -->
                                    <td sec:authorize="hasRole('ADMIN')">
                                        <form th:if="${alert.status.name() == 'OPEN'}"
                                              th:action="@{/alerts/{id}/ack(id=${alert.id})}"
                                              method="post" class="d-inline">
                                            <button type="submit" class="sx-btn sx-btn-success sx-btn-sm" title="Acknowledge">
                                                <i class="bi bi-check-lg"></i> ACK
                                            </button>
                                        </form>
                                    </td>
                                </tr>

                                <tr th:if="${#lists.isEmpty(alerts)}">
                                    <td colspan="8" style="text-align:center;padding:48px;color:var(--sx-text-muted);">
                                        <i class="bi bi-check-circle-fill" style="font-size:36px;display:block;margin-bottom:10px;color:var(--sx-green);opacity:.7;"></i>
                                        <span style="font-size:14px;font-weight:500;">All clear — no alerts</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
