<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>

<div class="sx-login-bg">
    <div class="sx-login-card">

        <!-- Header -->
        <div class="sx-login-header">
            <div class="sx-login-logo">
                <i class="bi bi-shield-check"></i>
            </div>
            <h1 class="sx-login-title">SentinelX</h1>
            <p class="sx-login-sub">Monitoring &amp; Alerting Platform</p>
        </div>

        <!-- Body -->
        <div class="sx-login-body">

            <div th:if="${param.error}" class="sx-flash sx-flash-error">
                <i class="bi bi-exclamation-triangle-fill"></i>
                Invalid username or password.
                <button class="sx-flash-dismiss" type="button">&times;</button>
            </div>
            <div th:if="${param.logout}" class="sx-flash sx-flash-success">
                <i class="bi bi-check-circle-fill"></i>
                You have been signed out.
                <button class="sx-flash-dismiss" type="button">&times;</button>
            </div>

            <form th:action="@{/login}" method="post" autocomplete="on">

                <div style="margin-bottom:16px;">
                    <label for="username" class="sx-form-label">Username</label>
                    <div class="sx-input-group">
                        <span class="sx-input-addon" style="border-right:none; border-radius:6px 0 0 6px;">
                            <i class="bi bi-person" style="font-size:14px;"></i>
                        </span>
                        <input type="text" id="username" name="username"
                               class="sx-input"
                               style="border-radius:0 6px 6px 0; border-left:none;"
                               placeholder="admin"
                               required autofocus autocomplete="username"/>
                    </div>
                </div>

                <div style="margin-bottom:24px;">
                    <label for="password" class="sx-form-label">Password</label>
                    <div class="sx-input-group">
                        <span class="sx-input-addon" style="border-right:none; border-radius:6px 0 0 6px;">
                            <i class="bi bi-lock" style="font-size:14px;"></i>
                        </span>
                        <input type="password" id="password" name="password"
                               class="sx-input"
                               style="border-radius:0 6px 6px 0; border-left:none;"
                               placeholder="••••••••"
                               required autocomplete="current-password"/>
                    </div>
                </div>

                <button type="submit" class="sx-btn sx-btn-primary" style="width:100%; justify-content:center; padding:10px;">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Sign In
                </button>
            </form>
        </div>

        <!-- Footer -->
        <div class="sx-login-footer">
            SentinelX v0.1 &mdash; Self-hosted monitoring
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmJ6OOBmzQ/GZI6tQJrDRl2/J9"
        crossorigin="anonymous"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
