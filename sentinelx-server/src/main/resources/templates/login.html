<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center min-vh-100">

<div class="card bg-dark border-secondary shadow" style="width: 380px;">
    <div class="card-body p-4">
        <div class="text-center mb-4">
            <i class="bi bi-shield-check text-primary" style="font-size: 3rem;"></i>
            <h3 class="mt-2 fw-bold text-primary">SentinelX</h3>
            <p class="text-muted small">Monitoring &amp; Alerting Platform</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger py-2 small">
            <i class="bi bi-exclamation-triangle me-1"></i>Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="alert alert-success py-2 small">
            <i class="bi bi-check-circle me-1"></i>You have been logged out.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label small text-muted">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-secondary border-secondary text-light">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" id="username" name="username"
                           class="form-control bg-secondary border-secondary text-light"
                           placeholder="admin" required autofocus/>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label small text-muted">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-secondary border-secondary text-light">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" id="password" name="password"
                           class="form-control bg-secondary border-secondary text-light"
                           placeholder="••••••••" required/>
                </div>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
                </button>
            </div>
        </form>
    </div>
    <div class="card-footer text-center text-muted small border-secondary py-2">
        SentinelX v0.1 &mdash; Self-hosted monitoring
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmJ6OOBmzQ/GZI6tQJrDRl2/J9"
        crossorigin="anonymous"></script>
</body>
</html>
