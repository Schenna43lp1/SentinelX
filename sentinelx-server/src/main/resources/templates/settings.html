<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Settings')}"></head>
<body class="bg-dark text-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-4" style="max-width: 680px;">
    <h4 class="fw-semibold mb-4"><i class="bi bi-gear me-2 text-primary"></i>Settings</h4>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show py-2" role="alert">
        <i class="bi bi-check-circle me-1"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/settings}" method="post">

        <!-- Telegram -->
        <div class="card bg-secondary border-0 shadow mb-4">
            <div class="card-header bg-transparent border-0 fw-semibold">
                <i class="bi bi-telegram me-1 text-info"></i>Telegram Notifications
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label small text-muted">Bot Token</label>
                    <input type="password" name="telegramBotToken"
                           class="form-control bg-dark border-secondary text-light font-monospace"
                           th:value="${telegramBotToken}"
                           placeholder="123456789:ABCdef..."/>
                    <div class="form-text text-muted">Obtain from @BotFather on Telegram.</div>
                </div>
                <div class="mb-0">
                    <label class="form-label small text-muted">Chat ID</label>
                    <input type="text" name="telegramChatId"
                           class="form-control bg-dark border-secondary text-light"
                           th:value="${telegramChatId}"
                           placeholder="-100123456789"/>
                    <div class="form-text text-muted">Negative for group chats, positive for direct.</div>
                </div>
            </div>
        </div>

        <!-- Alert Thresholds -->
        <div class="card bg-secondary border-0 shadow mb-4">
            <div class="card-header bg-transparent border-0 fw-semibold">
                <i class="bi bi-sliders me-1 text-warning"></i>Alert Thresholds
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small text-muted">CPU Threshold (%)</label>
                        <input type="number" name="cpuThreshold" min="1" max="100"
                               class="form-control bg-dark border-secondary text-light"
                               th:value="${cpuThreshold}"/>
                        <div class="form-text text-muted">Raise WARNING when CPU exceeds this value.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-muted">RAM Threshold (%)</label>
                        <input type="number" name="ramThreshold" min="1" max="100"
                               class="form-control bg-dark border-secondary text-light"
                               th:value="${ramThreshold}"/>
                        <div class="form-text text-muted">Raise WARNING when RAM exceeds this value.</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Agent -->
        <div class="card bg-secondary border-0 shadow mb-4">
            <div class="card-header bg-transparent border-0 fw-semibold">
                <i class="bi bi-activity me-1 text-success"></i>Agent Settings
            </div>
            <div class="card-body">
                <div>
                    <label class="form-label small text-muted">Agent Timeout (seconds)</label>
                    <input type="number" name="agentTimeoutSeconds" min="10" max="3600"
                           class="form-control bg-dark border-secondary text-light"
                           th:value="${agentTimeoutSeconds}"/>
                    <div class="form-text text-muted">Seconds without a heartbeat before a node is marked OFFLINE.</div>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="bi bi-save me-1"></i>Save Settings
        </button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmJ6OOBmzQ/GZI6tQJrDRl2/J9"
        crossorigin="anonymous"></script>
</body>
</html>
