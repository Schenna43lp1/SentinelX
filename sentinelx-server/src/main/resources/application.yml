spring:
  application:
    name: sentinelx-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinelx}
    username: ${DB_USERNAME:sentinelx}
    password: ${DB_PASSWORD:sentinelx}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  security:
    # Custom config in SecurityConfig
    ignored: /static/**

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    whitelabel:
      enabled: false

sentinelx:
  agent:
    # Seconds after which a node is considered offline
    timeout-seconds: ${AGENT_TIMEOUT_SECONDS:60}
  monitoring:
    # Interval in seconds for running HTTP/ping checks
    check-interval-seconds: ${CHECK_INTERVAL_SECONDS:30}

logging:
  level:
    com.sentinelx: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
